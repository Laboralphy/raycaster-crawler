# Publie le jeu sur GitHub Pages à chaque push sur master :
# https://laboralphy.github.io/raycaster-crawler/
# Tests, construction de crawler.js, puis copie des seuls fichiers du jeu
# (les mêmes que l'archive de npm run dist) dans dist/site, qui est publié.
# À activer une fois : Settings > Pages > Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un seul déploiement à la fois ; un nouveau push remplace celui en attente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
